name: Update Rain

on:
  schedule:
    - cron: "0 0 * * *"
  
  workflow_dispatch:

jobs:
  update:
    name: Update Rain
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Clone ${{ github.repository }}
        uses: actions/checkout@v7
      
      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          args: --accept-dns=false
          ping: seika
  
        # https://github.com/tailscale/github-action/issues/315
      - name: Restore DNS
        run: sudo networksetup -setdnsservers Ethernet Empty
      
      - name: Download AltServer
        run: |
          curl -fsSLO --retry 5 --retry-delay 5 https://files.seika.computer/altserver.zip
          unzip altserver.zip -d altserver

      - name: Get IPA Info
        id: ipa
        shell: uvx xonsh {0}
        run: |
          import json

          assets = json.loads($(gh release view --json assets))["assets"]
          ipa = next(asset for asset in assets if asset["name"].endswith(".ipa"))
          
          for key, value in ipa.items():
            echo f"{key}={value}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ra1ncord/RainTweak

      - name: Download Rain
        run: curl -fsSLO ${{ steps.ipa.outputs.url }}
      
      - name: Update AltSource (altsource CLI)
        run: | 
          altserver/AltServer.app/Contents/MacOS/altsource update altsource.json \
          --ipa ${{ steps.ipa.outputs.name }} \
          --version-download-url ${{ steps.ipa.outputs.url }} \
          --app-name Rain \
          --app-developer "Discord Inc. and Rain contributors" \
          --app-subtitle "A Discord client mod for mobile" \
          --app-tint-color "#5865F2" \
          --app-category social

      - name: Update AltSource (Manual)
        run: uv run ${{ github.workspace }}/scripts/update.py

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: altsource.json
          sign-commits: true
      
      - name: Merge Pull Request
        if: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --squash ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ github.token }}