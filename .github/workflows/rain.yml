name: Update Rain

on:
  schedule:
    - cron: "0 0 * * *"
  
  workflow_dispatch:

jobs:
  update:
    name: Update Rain
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Clone ${{ github.repository }}
        uses: actions/checkout@v7
      
      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          ping: seika
      
      - name: Download AltServer
        run: |
          curl -fsSLO --retry 5 --retry-delay 5 https://files.seika.computer/altserver.zip
          unzip altserver.zip -d altserver
      
      - name: Get Rain Info
        id: rain
        shell: uvx xonsh {0}
        run: |
          import json
          import os

          release = json.loads($(gh release view --json assets,tagName,publishedAt))

          outputs = {
            "url": next(asset["url"] for asset in release["assets"] if asset["name"] == "RainTweak.ipa"),
            "version": release["tagName"].lstrip("v"),
            "date": release["publishedAt"],
            "notes": release["body"]
          }

          for key, value in outputs.items():
            print(f"{key}={value}", file=open(os.getenv("GITHUB_OUTPUT"), "a"))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ra1ncord/RainTweak
      
      - name: Download Rain
        run: curl -fsSLO ${{ steps.rain.outputs.url }}
      
      - name: Update AltSource (altsource CLI)
        run: | 
          altserver/AltServer.app/Contents/MacOS/altsource update altsource.json \
          --ipa RainTweak.ipa \
          --version-download-url ${{ steps.rain.outputs.url }} \
          --app-name Rain \
          --app-developer "Discord Inc. and Rain contributors" \
          --app-subtitle "A Discord client mod for mobile" \
          --app-tint-color "#5865F2" \
          --app-category social \
          --version-description ${{ steps.rain.outputs.notes }}
      
      - name: Update AltSource (Manual)
        shell: uv run --with httpx2 python {0}
        run: |
          import json
          from pathlib import Path

          import httpx2 as httpx

          altsource_file = Path("altsource.json")
          altsource = json.loads(altsource_file.read_text())

          itunes_metadata = httpx.get("https://itunes.apple.com/lookup?bundleId=com.hammerandchisel.discord").raise_for_status().json()["results"][0]

          app = altsource["apps"][-1]
          app["localizedDescription"] = "Rain is a Discord client mod for mobile.\n\n For more information, visit Rain's repository: https://codeberg.org/raincord/rain"
          app["iconURL"] = itunes_metadata["artworkUrl100"]

          version_info = app["versions"][-1]
          version_info["version"] = "${{ steps.rain.outputs.version }}"
          version_info["date"] = "${{ steps.rain.outputs.date }}"

          app["screenshots"] = {}

          for device in ["iphone", "ipad"]:
            for screenshot_url in itunes_metadata.get("ipadScreenshotUrls" if device == "ipad" else "screenshotUrls", []):
              width, height = [int(i) for i in screenshot_url.split("/")[-1].split("bb")[0].split("x")]
              app["screenshots"].setdefault(device, []).append({"imageURL": screenshot_url, "width": width, "height": height})

          altsource_file.write_text(json.dumps(altsource))
      
      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: altsource.json
          sign-commits: true
      
      - name: Merge Pull Request
        if: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --squash ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ github.token }}